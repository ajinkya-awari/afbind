[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afbind"
version = "0.1.0"
description = "AlphaFold-Guided Protein-Ligand Binding Benchmark — offline contract library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
graph = [
    "torch",
    "torch-geometric",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["afbind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
